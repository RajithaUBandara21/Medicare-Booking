services:
  - type: web
    name: medicare-booking-backend
    runtime: node
    rootDir: BackEnd
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: medicare-booking-frontend
    runtime: static
    rootDir: FrontEnd
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_CLOUD_NAME
        sync: false
      - key: VITE_UPLOAD_PRESET_NAME
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
